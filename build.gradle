project.logger.lifecycle("versionCode = ${android.defaultConfig.versionCode}")
project.logger.lifecycle("versionName = ${android.defaultConfig.versionName}")
// Preview native engine is built separately to isolate modern GGML from stock JNI.
// Ordinary builds do not include it; the opt-in setting then safely uses stock CPU.
// Build tooling is repo-owned; see tools/opencl/README.md.
if (project.hasProperty('experimentalOpenClNative')) {
    android.sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('opencl-jni')
    android.sourceSets.main.assets.srcDir layout.buildDirectory.dir('opencl-assets')
    tasks.register('prepareExperimentalOpenCl', Exec) {
        workingDir rootProject.projectDir
        commandLine 'bash', file('tools/opencl/build-native.sh').absolutePath
    }
    tasks.named('preBuild').configure { dependsOn 'prepareExperimentalOpenCl' }
}

// Debug-only Whistle validation. Never builds or links stock Whisper.
android.sourceSets.debug.jniLibs.srcDir layout.buildDirectory.dir('whistle-jni')
android.sourceSets.debug.assets.srcDir layout.buildDirectory.dir('whistle-assets')
tasks.register('prepareWhistleDebug', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', file('tools/whistle/build-jni.sh').absolutePath
}
tasks.configureEach { if (name in ['preCookieDebugBuild', 'preUnstableDebugBuild']) dependsOn 'prepareWhistleDebug' }
if (project.hasProperty('cookieVerifiedNativeDir')) {
    android.sourceSets.debug.jniLibs.srcDir file(project.property('cookieVerifiedNativeDir'))
}
